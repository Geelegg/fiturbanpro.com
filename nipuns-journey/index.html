<style>
html,body{height:100%}
body.lock{margin:0;min-height:100%;display:grid;place-items:center;background-color:var(--deep);background-image:var(--tex-deep);color:var(--ondeep);font:400 18px/1.6 var(--fb);padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
.gate{width:min(100%,380px);display:grid;justify-items:center;gap:22px;text-align:center;visibility:hidden}
.ready .gate{visibility:visible}
.gate img{height:calc(var(--logoh) * 1.5);width:auto}
.gate .rule{width:36px;height:1px;background:var(--hi)}
.gate .lbl{color:var(--ondeepm)}
.gate p{margin:0;color:var(--ondeepm);font-size:1rem}
.gate form{display:flex;width:100%;border-bottom:1px solid color-mix(in srgb,var(--ondeep) 40%,transparent);margin-top:8px}
.gate input{flex:1;min-width:0;background:transparent;border:0;color:var(--ondeep);font:inherit;padding:12px 4px;outline:none;letter-spacing:.06em}
.gate input::placeholder{color:var(--ondeepm)}
.gate button{background:none;border:0;color:var(--ondeep);font:600 .95rem var(--fb);cursor:pointer;padding:12px 4px;display:inline-flex;align-items:center;gap:8px}
.gate form:focus-within{border-color:var(--ondeep)}
.gate .err{color:var(--hi);min-height:1.6em;font-size:.9rem}
.gate .shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.gate .shake{animation:none}}
